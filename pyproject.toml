[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-agent-memory"
version = "0.0.0"
description = "Scaffold for an agent-memory hackathon project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Devon Generally" }]
dependencies = [
  "asyncpg==0.31.0",
  "openai==3.1.0",
  "pydantic==2.13.4",
  "rich==15.0.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.0",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "lambda", "scripts", "tests"]

[tool.bandit]
exclude_dirs = ["tests"]
